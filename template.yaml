AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SaansAlert - area-level air quality and health-profile advice for Delhi-NCR

Parameters:
  ParamPrefix:
    Type: String
    Default: /saansalert
    Description: SSM SecureString parameters <prefix>/openweather_key and <prefix>/openaq_key must exist before deploy
  IngestSchedule:
    Type: String
    Default: rate(2 hours)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    CodeUri: backend/
    Environment:
      Variables:
        OWM_KEY_PARAM: "XXXX"
        OPENAQ_KEY_PARAM: "XXXX"
        READINGS_TABLE: !Ref ReadingsTable
        STATE_TABLE: !Ref AlertStateTable
        TOPIC_PREFIX: saansalert

Resources:
  # ---------- data ----------
  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: areaId, AttributeType: S}
        - {AttributeName: ts, AttributeType: N}
      KeySchema:
        - {AttributeName: areaId, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  AlertStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: areaId, AttributeType: S}
      KeySchema:
        - {AttributeName: areaId, KeyType: HASH}

  # ---------- compute ----------
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ingest.app.handler
      Timeout: 240
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ReadingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AlertStateTable}
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Publish]
              Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:saansalert-*'
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref IngestSchedule

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.app.handler
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref ReadingsTable}
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Subscribe]
              Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:saansalert-*'
      Events:
        Areas: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /areas, Method: GET}}
        Area: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/areas/{areaId}', Method: GET}}
        History: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/areas/{areaId}/history', Method: GET}}
        Subscribe: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /subscribe, Method: POST}}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']          # public read-only data; tighten to the CloudFront domain if you add auth
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20     # abuse guard, esp. for /subscribe
        ThrottlingRateLimit: 10

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ingest Lambda failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref IngestFunction}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------- static site: private S3 bucket behind CloudFront (OAC) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  ApiUrl: {Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'}
  SiteUrl: {Value: !Sub 'https://${SiteDistribution.DomainName}'}
  SiteBucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref SiteDistribution}
  IngestFunctionName: {Value: !Ref IngestFunction}
